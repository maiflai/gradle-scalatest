buildscript {
    repositories {
        // need to get up to the working directory of gradle-plugins build
        flatDir { dir "${project.projectDir}/../../../../build/libs" }
    }
    dependencies {
        classpath ':gradle-scalatest:+'
    }
}

apply plugin: 'java'
apply plugin: 'scala'
apply plugin: 'com.github.maiflai.scalatest'

repositories {
    mavenCentral()
}

scala.scalaVersion = '2.13.15'

testing {
    suites {
        test {
            dependencies {
                implementation project()
                implementation 'junit:junit:4.13.2'
                implementation 'org.scalatest:scalatest_2.13:3.2.19'
                runtimeOnly 'com.vladsch.flexmark:flexmark-all:0.62.2'
            }
            targets {
                register('integrationTest') { 
                    testTask.configure {
                        systemProperty 'category', 'integration' 
                    }
                }
            }
        }
    }
}


